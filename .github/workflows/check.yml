name: Retrieval metric checks
on: [push, pull_request]
jobs:
  offline-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: make test
      - run: make smoke
      - run: python -m compileall -q ragstudy scripts tests
      - run: bash -n scripts/bootstrap.sh
